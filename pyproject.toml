[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name (the import package & CLI command remain `pytangle`).
name = "deptangle"
dynamic = ["version"]
description = "The lightning-fast, visual dependency detective that untangles and fixes your Python environments."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dependencies", "security", "cve", "osv", "uv", "lockfile", "cli", "visualization"]
authors = [{ name = "Prem Solanki", email = "premsolanki2503@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: System :: Software Distribution",
]

# Pinned with lower bounds for reproducibility; upper bounds guard against
# surprise breaking changes from transitive supply-chain updates.
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "requests>=2.32,<3.0",
    "pyvis>=0.3.2,<0.4",
    "packaging>=24.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests>=2.32",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Solanki-Prem/pytangle"
Repository = "https://github.com/Solanki-Prem/pytangle"
Issues = "https://github.com/Solanki-Prem/pytangle/issues"

[project.scripts]
pytangle = "pytangle.cli:app"

[tool.hatch.version]
path = "src/pytangle/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytangle"]

[tool.hatch.build.targets.sdist]
include = ["src/pytangle", "README.md", "LICENSE", "SECURITY.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Typer's API *requires* calling typer.Option()/Argument() in parameter
# defaults; B008 is a false positive for this idiom. UP045 is suppressed
# because Typer evaluates annotations at runtime via get_type_hints, and the
# `X | None` form raises TypeError on Python 3.9 — so we must keep Optional[X].
"src/pytangle/cli.py" = ["B008", "UP045"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
# Put the project root on sys.path so tests can import the `tests` package
# (shared fakes live in tests/conftest.py).
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
