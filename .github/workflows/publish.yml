name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytangle
    permissions:
      # Mandatory for PyPI Trusted Publishing (OIDC) — no API token stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: Verify metadata
        run: uvx twine check dist/*
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
